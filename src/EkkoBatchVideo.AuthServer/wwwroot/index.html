<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Ekko Tools Admin</title><style>body{font:15px Segoe UI,Arial;max-width:1120px;margin:35px auto;background:#101827;color:#e5edf8}input,button{padding:9px;margin:4px;border-radius:5px;border:1px solid #44546c;background:#172338;color:white}button{cursor:pointer;background:#167d91}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #33445e;text-align:left}.expired{color:#ff8a8a}.active{color:#72e0a0}.muted{color:#93a4bb}</style></head><body><h1>Ekko Tools · Quản lý tài khoản</h1><p>Khóa quản trị: <input id="key" type="password" size="35"><button onclick="load()">Đăng nhập</button><button onclick="backup()">Tải bản sao lưu</button></p><p id="msg"></p><table><thead><tr><th>Tài khoản</th><th>Hết hạn</th><th>Trạng thái</th><th>Máy</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table><script>
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'X-Admin-Key':key.value,'Content-Type':'application/json'};let r=await fetch(url,opt);if(!r.ok)throw Error(r.status===401?'Khóa quản trị không đúng':await r.text());return r.json()}
async function load(){try{let us=await api('/api/admin/users');rows.innerHTML=us.map(u=>`<tr><td>${u.email}</td><td>${new Date(u.expiresAt).toLocaleString()}</td><td class="${u.active?'active':'expired'}">${u.active?'Còn hạn':'Chờ duyệt / đã khóa'}</td><td class="${u.deviceLocked?'active':'muted'}">${u.deviceLocked?'Đã gắn máy':'Chưa gắn'}</td><td><button onclick="addDays('${u.email}')">+ ngày</button><button onclick="addHours('${u.email}')">+ giờ</button><button onclick="setDate('${u.email}')">Đặt ngày</button><button onclick="password('${u.email}')">Đặt mật khẩu</button><button onclick="resetDevice('${u.email}')">Reset máy</button><button onclick="revoke('${u.email}')">Khóa</button><button onclick="removeUser('${u.email}')">Xóa</button></td></tr>`).join('');msg.textContent='Đã tải '+us.length+' tài khoản.'}catch(e){msg.textContent=e.message}}
async function addDays(e){let d=prompt('Cộng bao nhiêu ngày?','30');if(d!==null){await api('/api/admin/users/'+encodeURIComponent(e)+'/expiry',{method:'POST',body:JSON.stringify({days:Number(d)})});load()}}
async function addHours(e){let h=prompt('Cộng bao nhiêu giờ?','1');if(h!==null){await api('/api/admin/users/'+encodeURIComponent(e)+'/expiry',{method:'POST',body:JSON.stringify({hours:Number(h)})});load()}}
async function removeUser(e){if(confirm('Xóa vĩnh viễn tài khoản '+e+'?')){await api('/api/admin/users/'+encodeURIComponent(e),{method:'DELETE'});load()}}
async function setDate(e){let d=prompt('Ngày hết hạn ISO:');if(d){await api('/api/admin/users/'+encodeURIComponent(e)+'/expiry',{method:'POST',body:JSON.stringify({expiresAt:d})});load()}}
async function password(e){let p=prompt('Mật khẩu tạm thời:');if(p){await api('/api/admin/users/'+encodeURIComponent(e)+'/password',{method:'POST',body:JSON.stringify({password:p})});msg.textContent='Đã đặt lại mật khẩu cho '+e}}
async function resetDevice(e){if(confirm('Reset máy cho tài khoản '+e+'? Lần đăng nhập tiếp theo sẽ gắn với máy mới.')){await api('/api/admin/users/'+encodeURIComponent(e)+'/reset-device',{method:'POST'});load()}}
async function revoke(e){if(confirm('Khóa tài khoản '+e+'?')){await api('/api/admin/users/'+encodeURIComponent(e)+'/revoke',{method:'POST'});load()}}
async function backup(){try{let r=await fetch('/api/admin/backup',{headers:{'X-Admin-Key':key.value}});if(!r.ok)throw Error('Khóa quản trị không đúng');let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ekko-accounts-backup.json';a.click()}catch(e){msg.textContent=e.message}}
</script></body></html>
