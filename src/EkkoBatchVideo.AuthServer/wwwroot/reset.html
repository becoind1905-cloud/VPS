<!doctype html><meta charset="utf-8"><title>Đặt lại mật khẩu</title><style>body{font:16px Segoe UI;max-width:420px;margin:60px auto;background:#101827;color:white}input,button{display:block;width:100%;padding:10px;margin:10px 0;box-sizing:border-box}button{background:#167d91;color:white;border:0}</style><h1>Đặt lại mật khẩu</h1><input id="p" type="password" placeholder="Mật khẩu mới"><button onclick="go()">Lưu mật khẩu</button><p id="m"></p><script>async function go(){let r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:p.value})});let x=await r.json();m.textContent=x.message||'Hoàn tất'}</script>
